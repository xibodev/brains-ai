[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="brains-ai"
version = "1.1.4"
requires-python=">=3.11"
description="Local-first control plane and coordination layer for AI coding agents"
readme="README.md"
license="MIT"
license-files=["LICENSE"]
authors=[{ name = "mekjr1 and brains contributors" }]
keywords=["ai-agents", "coding-agents", "control-plane", "openai-compatible", "mcp", "local-first"]
classifiers=[
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies=[
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "mcp>=1.0,<2",
  "jinja2>=3.1",
  "starlette>=1.3.1",
]

[project.optional-dependencies]
dev=[
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]
# --- Optional runtime subsystems ---
# Each extra is gated at startup by config: if a subsystem is enabled in
# brains.runtime.yaml without its extra installed, Brains fails loud at
# load time with the matching `pip install` hint. Never silent-installs.
litellm=["litellm>=1.40"]
postgres=["asyncpg>=0.29", "psycopg[binary]>=3.1"]
telegram=["python-telegram-bot>=21.0"]
slack=["slack_sdk>=3.27"]
whatsapp=["httpx>=0.27"]
whatsapp_web=["httpx>=0.27"]
otel=[
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
# Meta-extra: install everything optional in one go.
all=[
  "litellm>=1.40",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "python-telegram-bot>=21.0",
  "slack_sdk>=3.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.scripts]
# Canonical (and only) binary. Matches the PyPI distribution name.
# Every feature is a subcommand of `brains-ai`:
#   serve / serve-all   — proxy gateway (+ dashboard + MCP SSE)
#   setup / wire / unwire — first-run + MCP wiring
#   features            — optional-subsystem wizard
#   run <tool>          — spawn an LLM CLI against the brains gateway
#                          (e.g. `brains-ai run claude -p "hi"`)
brains-ai="brains.cli.app:app"

[project.urls]
Homepage="https://github.com/xibodev/brains-ai"
Repository="https://github.com/xibodev/brains-ai"
Issues="https://github.com/xibodev/brains-ai/issues"

[tool.setuptools.packages.find]
where=["src"]

[tool.setuptools.package-data]
"brains.web" = ["templates/**/*.html", "static/**/*.css", "static/**/*.js", "spa/**/*"]
# The frozen baseline DDL and any SQL-file migrations are the schema contract;
# an installed wheel that omits them cannot create or upgrade a database.
"brains.storage" = ["baseline/*.sql", "sql_migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath=["src"]
addopts="-p no:asyncio"
markers = [
    "acceptance: Brains feature acceptance criteria mapped to the canonical Feature, Journey, and AC contracts.",
]

[tool.coverage.run]
source = ["brains"]
branch = true
omit = [
  "*/tests/*",
  "*/__main__.py",
  "src/brains/web/templates/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
skip_covered = false
show_missing = true

[tool.ruff]
line-length=100
target-version="py311"

[tool.ruff.lint]
select=["E","F","W","I","B","UP","SIM"]
ignore=["E501","B008"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use `pytest.raises(Exception)` for invariant checks
# and may import-late after sys.path mutation.
"tests/*"=["E402", "B017"]
# The CLI is the user-facing shell — it catches typed exceptions, prints a
# clean one-line "error: <msg>", and re-raises typer.Exit. The original
# chain is intentionally dropped to avoid noisy tracebacks on the command
# line; the prior `typer.echo(..., err=True)` is the user-facing surface.
"src/brains/cli/app.py"=["B904"]

[tool.mypy]
python_version="3.11"
ignore_missing_imports=true
warn_unused_ignores=true
warn_redundant_casts=true
no_implicit_optional=true
files=["src/brains"]
