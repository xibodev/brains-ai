name: Feature request
description: Propose a change to the supported Brains product contract.
title: "[feat] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the [Product Brief](../../docs/product/PRODUCT_BRIEF.md) and
        [Feature Contract](../../docs/product/FEATURE_CONTRACT.md). The
        [Core Backlog](../../docs/product/BACKLOG.md) contains schedulable work; the
        [Frozen Backlog](../../docs/product/FROZEN_BACKLOG.md) is deferred and is not a
        current product promise.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user outcome or limitation without including private data.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired supported CLI, MCP, browser, API, or operational contract.
    validations:
      required: true

  - type: dropdown
    id: product_status
    attributes:
      label: Product status
      description: How does this relate to the current product boundary?
      options:
        - Change to an advertised core capability
        - New capability not present in the current contract
        - Request to reconsider a frozen or withdrawn capability
        - Documentation or developer-experience change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds and why a separate tool is or is not sufficient.

  - type: textarea
    id: contract
    attributes:
      label: Contract mapping
      description: List affected Feature, Persona, Journey, acceptance, or backlog IDs when known.
      placeholder: "F3, B2, P1, J8, AC-F3-05"

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight
      options:
        - label: I reviewed the current product contract and both backlog boundaries.
          required: true
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed secrets, personal data, private paths, and private infrastructure details.
          required: true
