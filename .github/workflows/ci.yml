name: ci

# The blocking quality gate for every push and pull request targeting the
# integration or promotion branch (BL-P1-01). Every job below fails the workflow when it fails: there is no
# `continue-on-error` on a required gate, and no gate reports success on a
# command that did not run. The release workflow (release.yml) does NOT re-run
# this; instead its `qualify` job refuses to publish unless the aggregate
# `quality gate` check below already succeeded for the exact tagged commit.
#
# Gate map (docs/QUALITY_GATES.md):
#   docs        documentation contract + generated traceability contract
#   lint        ruff check + ruff format
#   typecheck   mypy
#   test        pytest acceptance subset + full unit/integration suite
#   migrations  migration contract + frozen-baseline rendering contract
#   spa         SPA typecheck, production build, committed-bundle comparison
#   package     wheel + sdist build and shipped-data assertions
#   native      exact-package installation and native recovery probes
#   harness     isolated Claude and OpenCode lifecycle probes
#   privacy     personal-identifier and product-vocabulary scan
#   docker      runtime image build + container health smoke
#   e2e         Playwright journey suite against an ephemeral hub
#   gate        one required status that depends on all of the above

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  docs:
    name: documentation + traceability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project + dev extras
        run: uv sync --extra dev

      - name: Install checked TypeScript parser
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Documentation contract
        run: uv run python scripts/check_docs.py

      # Derives SPA routes, API client calls, mounted server routes, entities,
      # migrations and stable-ID test markers from source and fails on any
      # orphan or unmatched surface.
      - name: Generated traceability contract
        run: uv run python scripts/check_traceability.py

      - name: Contract self-tests
        run: >-
          uv run python -m pytest -q
          tests/test_check_docs.py
          tests/test_check_traceability.py
          tests/test_core_surface_manifest.py
          tests/test_distribution_contract.py

  lint:
    name: ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project + dev extras
        run: uv sync --extra dev
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .
      - name: Format check (ruff format)
        run: uv run ruff format --check --diff .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project + dev extras
        run: uv sync --extra dev
      # Blocking. The checked surface is `files` in [tool.mypy]; widening it is
      # a deliberate change, but nothing in it may regress.
      - name: Type-check (mypy)
        run: uv run mypy

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install project + dev extras
        run: uv sync --extra dev

      # tests/test_core_surface_manifest.py drives the TypeScript AST parser
      # through scripts/inventory_spa_surface.mjs. The full suite runs that file,
      # so this job needs the same parser the docs job provisions; without it the
      # manifest tests fail closed on a missing dependency rather than on a real
      # surface defect.
      - name: Install checked TypeScript parser
        working-directory: frontend
        run: npm ci --ignore-scripts

      # The AC-mapped acceptance contracts run first so a product-promise
      # regression is attributable without reading the whole suite log.
      - name: Brains acceptance tests
        run: >
          uv run python -m pytest -q -m acceptance
          --junitxml=reports/acceptance-${{ matrix.python }}.xml

      - name: Unit + integration tests
        run: >
          uv run python -m pytest -q --maxfail=20
          --junitxml=reports/pytest-${{ matrix.python }}.xml
          --cov=brains
          --cov-report=xml:coverage.xml
          --cov-report=term-missing:skip-covered

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ matrix.python }}
          path: |
            reports/
            coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: brains-py3.12
          fail_ci_if_error: false
          # Public repo — tokenless upload supported. Add CODECOV_TOKEN later if needed.

  migrations:
    name: migration + baseline contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project + dev extras
        run: uv sync --extra dev

      # The frozen baseline plus the ordered, checksummed delta corpus is the
      # schema contract: these modules assert a fresh store and every legacy
      # store reach the same schema, that the committed baseline is exactly
      # what the generator renders for the tables it froze, and that every way
      # the ledger can be wrong is detected rather than absorbed.
      - name: Migration and baseline contract
        run: >
          uv run python -m pytest -q
          tests/test_migration_contract.py
          tests/test_baseline_schema_generation.py
          tests/test_consolidation_migration.py
          tests/test_sqlite_integrity.py
          --junitxml=reports/migrations.xml

      - name: Baseline rendering is deterministic
        # The frozen baseline is compared against the generator by
        # tests/test_baseline_schema_generation.py. This step additionally
        # proves the renderer is stable across processes, so "regenerate the
        # baseline" is a reproducible operation rather than a diff-producing
        # one.
        run: |
          set -euo pipefail
          for backend in sqlite postgresql; do
            uv run python scripts/generate_baseline_schema.py "$backend" > "render-a-$backend.sql"
            uv run python scripts/generate_baseline_schema.py "$backend" > "render-b-$backend.sql"
            diff -u "render-a-$backend.sql" "render-b-$backend.sql"
          done
          echo "ok: baseline DDL rendering is deterministic"

      - name: Migration corpus has no uncommitted drift
        run: |
          set -e
          if ! git diff --quiet -- src/brains/storage; then
            echo "::error::the migration gate modified tracked storage files"
            git --no-pager diff --stat -- src/brains/storage
            exit 1
          fi
          echo "ok: tracked storage files untouched"

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reports
          path: |
            reports/
            render-*.sql
          retention-days: 7
          if-no-files-found: ignore

  spa:
    name: SPA typecheck + build + bundle contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `npm ci` (never `npm install`) is the only install defined by the
      # lockfile alone, and it refuses to run when package.json and
      # package-lock.json disagree.
      - name: Install SPA dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck SPA
        working-directory: frontend
        run: npm run typecheck

      # Rebuilds the console into a scratch directory and compares it with the
      # bundle committed under src/brains/web/spa, which the wheel ships.
      - name: Committed bundle matches source
        run: python scripts/check_spa_bundle.py --no-install --keep

      - name: Worktree is unchanged by the bundle gate
        run: |
          set -e
          if ! git diff --quiet -- src/brains/web/spa; then
            echo "::error::the bundle gate modified the committed SPA bundle"
            git --no-pager diff --stat -- src/brains/web/spa
            exit 1
          fi
          echo "ok: committed bundle untouched"

      - name: Upload rebuilt bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spa-rebuilt-bundle
          path: frontend/.bundle-check/
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: build wheel + sdist
    needs: [docs, lint, typecheck, test, migrations, spa]
    runs-on: ubuntu-latest
    outputs:
      manifest-sha256: ${{ steps.package-provenance.outputs.manifest-sha256 }}
      artifact-id: ${{ steps.package-artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.package-artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install checked TypeScript parser
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Install project + dev extras
        run: uv sync --extra dev
      - name: Build distribution
        run: uv build
      - name: Bind native evidence to source tree and exact wheel
        id: package-provenance
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)"
          test -n "$wheel"
          git_executable="$(realpath "$(command -v git)")"
          uv run python scripts/probe_native_wakeup_recovery.py \
            --prepare-package \
            --candidate "$GITHUB_SHA" \
            --git-executable "$git_executable" \
            --wheel "$wheel" \
            --package-manifest dist/native-wakeup-package-provenance.json
          echo "manifest-sha256=$(sha256sum dist/native-wakeup-package-provenance.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Core surface boundary from fresh artifacts
        run: uv run python scripts/check_core_surface.py --dist dist
      - name: Show artifacts
        run: ls -la dist

      # A wheel that omits the SPA bundle, the frozen baseline DDL or the SQL
      # migrations cannot serve the console or create/upgrade a database, and
      # neither `uv build` nor an import test notices.
      - name: Distribution ships the runtime data files
        run: python scripts/check_distribution.py

      - uses: actions/upload-artifact@v4
        id: package-artifact
        with:
          name: dist
          path: dist/
          retention-days: 7

  native-installation-probe:
    name: native package/wire probe (${{ matrix.host.manager }}, py${{ matrix.python }}, ${{ matrix.adapter }})
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        host:
          - os: windows-2022
            manager: task-scheduler
          - os: macos-14
            manager: launchd
          - os: ubuntu-24.04
            manager: systemd-user
        python: ["3.11", "3.12"]
        adapter: [copilot-cli, claude-code, codex, opencode]
        transport: [streamable-http]
    runs-on: ${{ matrix.host.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: matrix.adapter == 'opencode'
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/native-dist
      - name: Provision pinned supported OpenCode
        if: matrix.adapter == 'opencode'
        run: npm install --global opencode-ai@1.18.25
      - name: Install the exact wheel into a fresh private environment
        id: native-environment
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP is a drive-letter path on Windows that MSYS file tools
          # cannot resolve, and sha256sum does not exist on macOS. Normalise the
          # directory for bash and let Python own the digest so one script is
          # correct on all three supported hosts.
          if command -v cygpath >/dev/null 2>&1; then
            temp_dir="$(cygpath -u "$RUNNER_TEMP")"
          else
            temp_dir="$RUNNER_TEMP"
          fi
          wheel_count="$(find "$temp_dir/native-dist" -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')"
          test "$wheel_count" = 1
          python - <<'PY'
          import hashlib
          import os
          import pathlib

          dist = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-dist"
          manifest = dist / "native-wakeup-package-provenance.json"
          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_MANIFEST_SHA256"]
          if digest != expected:
              raise SystemExit("candidate package provenance does not match the built manifest")
          PY
          wheel="$(find "$temp_dir/native-dist" -maxdepth 1 -name '*.whl' -type f -print -quit)"
          venv="$temp_dir/brains-native-install-${{ matrix.host.manager }}-${{ matrix.python }}-${{ matrix.adapter }}"
          test ! -e "$venv"
          python -m venv "$venv"
          if test -x "$venv/Scripts/python.exe"; then
            probe_python="$venv/Scripts/python.exe"
          else
            probe_python="$venv/bin/python"
          fi
          "$probe_python" -m pip install "$wheel"
          git_executable="$("$probe_python" -c 'import shutil; value=shutil.which("git"); assert value; print(value)')"
          if test "${{ matrix.adapter }}" = opencode; then
            export BRAINS_REQUIRED_NATIVE_TOOLS=node,opencode
          else
            export BRAINS_REQUIRED_NATIVE_TOOLS=
          fi
          tool_paths="$("$probe_python" -c 'import json,os,shutil; names=[n for n in os.environ["BRAINS_REQUIRED_NATIVE_TOOLS"].split(",") if n]; values={n:shutil.which(n) for n in names}; assert all(values.values()); print(json.dumps(values,separators=(",",":")))')"
          echo "BRAINS_NATIVE_PROBE_PYTHON=$probe_python" >> "$GITHUB_ENV"
          # Later bash steps consume the normalised path, but the pwsh steps
          # cannot resolve an MSYS one, so publish the native form as the output.
          if command -v cygpath >/dev/null 2>&1; then
            echo "python=$(cygpath -w "$probe_python")" >> "$GITHUB_OUTPUT"
          else
            echo "python=$probe_python" >> "$GITHUB_OUTPUT"
          fi
          echo "BRAINS_NATIVE_PROBE_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "BRAINS_NATIVE_PACKAGE_MANIFEST=$temp_dir/native-dist/native-wakeup-package-provenance.json" >> "$GITHUB_ENV"
          echo "BRAINS_NATIVE_PROBE_GIT=$git_executable" >> "$GITHUB_ENV"
          echo "BRAINS_NATIVE_TOOL_PATHS=$tool_paths" >> "$GITHUB_ENV"
      - name: Probe exact package, native rendering, and selected wire adapter
        id: native-installation
        shell: bash
        run: >-
          "$BRAINS_NATIVE_PROBE_PYTHON" scripts/probe_native_installation.py
          --candidate "$GITHUB_SHA"
          --wheel "$BRAINS_NATIVE_PROBE_WHEEL"
          --package-manifest "$BRAINS_NATIVE_PACKAGE_MANIFEST"
          --git-executable "$BRAINS_NATIVE_PROBE_GIT"
          --tool "${{ matrix.adapter }}"
          --output "$RUNNER_TEMP/native-installation-evidence.json"
      # The evidence file is never exported before it is verified. Echo only the
      # bounded exception type, the curated provenance message and the porcelain
      # status, so a failing host is diagnosable without publishing unverified
      # evidence. ProvenanceFailure messages are fixed strings and carry no path.
      - name: Report the bounded native installation failure type
        if: failure() && steps.native-installation.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          python -c "import json,os,pathlib;
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-installation-evidence.json';
          data=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {};
          print('native installation error_type:', data.get('error_type', 'unavailable'));
          print('native installation reason   :', data.get('reason', 'unavailable'))"
          echo "--- git status --porcelain=v1 --untracked-files=all ---"
          git status --porcelain=v1 --untracked-files=all | head -n 40
          echo "--- provenance stage ---"
          "$BRAINS_NATIVE_PROBE_PYTHON" - <<'PY'
          import os
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          from native_evidence import ProvenanceFailure, package_provenance, source_provenance

          repo = pathlib.Path.cwd()
          git = pathlib.Path(os.environ["BRAINS_NATIVE_PROBE_GIT"])
          wheel = pathlib.Path(os.environ["BRAINS_NATIVE_PROBE_WHEEL"])
          manifest = pathlib.Path(os.environ["BRAINS_NATIVE_PACKAGE_MANIFEST"])
          try:
              source = source_provenance(repo, os.environ["GITHUB_SHA"], git)
          except ProvenanceFailure as exc:
              print("source_provenance failed:", exc)
              raise SystemExit(0)
          print("source_provenance ok")
          try:
              package_provenance(manifest, source=source, wheel_path=wheel)
          except ProvenanceFailure as exc:
              print("package_provenance failed:", exc)
              raise SystemExit(0)
          print("package_provenance ok; failure is in distribution_provenance or later")
          PY
      # The first probe call runs the installed console script and requires JSON
      # on stdout. When that parse fails the probe discards the output, so repeat
      # the call under the probe's own closed PATH and seeded home and echo what
      # the executable actually produced.
      - name: Report the installed executable output
        if: failure() && steps.native-installation.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          "$BRAINS_NATIVE_PROBE_PYTHON" - "${{ matrix.adapter }}" <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import probe_native_installation as probe
          from native_evidence import explicit_runtime_tools

          tool = sys.argv[1]
          required = ("node", "opencode") if tool == "opencode" else ()
          _tools, controlled = explicit_runtime_tools(
              os.environ.get("BRAINS_NATIVE_TOOL_PATHS", "{}"),
              required=required,
              prepend_paths=(Path(sys.executable).parent,),
          )
          os.environ["PATH"] = controlled
          name = "brains-ai.exe" if os.name == "nt" else "brains-ai"
          executable = Path(sys.prefix) / ("Scripts" if os.name == "nt" else "bin") / name

          with tempfile.TemporaryDirectory(prefix="brains-native-diag-") as raw:
              root = Path(raw)
              home, state, workspace = root / "home", root / "state", root / "workspace"
              for path in (home, state, workspace):
                  path.mkdir(mode=0o700)
              env = os.environ.copy()
              env.update(
                  {
                      "HOME": str(home),
                      "USERPROFILE": str(home),
                      "BRAINS_STATE_DIR": str(state),
                      "BRAINS_API_KEY": "synthetic-native-probe-key",
                      "BRAINS_MCP_BEARER_TOKEN": "synthetic-native-probe-key",
                  }
              )
              probe._seed(probe._config_path(home, tool), tool)
              calls = [
                  ("setup", ("setup", "--path", str(workspace), "--no-wire", "--json")),
                  (
                      "wire",
                      (
                          "wire", "--tool", tool, "--force", "--no-rules",
                          "--transport", "streamable-http", "--port", "24999",
                      ),
                  ),
              ]
              for label, args in calls:
                  done = subprocess.run(
                      [str(executable), *args],
                      check=False, capture_output=True, env=env, text=True, timeout=120,
                  )
                  print(f"--- {label}: returncode={done.returncode} ---")
                  print(f"--- {label}: stdout repr (first 600 chars) ---")
                  print(repr(done.stdout[:600]))
                  print(f"--- {label}: stderr (first 1500 chars) ---")
                  print(done.stderr[:1500])
          PY
      - name: Verify private native installation evidence before export
        shell: bash
        run: >-
          "$BRAINS_NATIVE_PROBE_PYTHON" scripts/verify_native_evidence.py
          --kind installation
          --candidate "$GITHUB_SHA"
          --manager "${{ matrix.host.manager }}"
          --python "${{ matrix.python }}"
          --adapter "${{ matrix.adapter }}"
          --input "$RUNNER_TEMP/native-installation-evidence.json"
      - name: Upload sanitized native installation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-install-${{ matrix.host.manager }}-py${{ matrix.python }}-${{ matrix.adapter }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-installation-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Prove Windows managed-binding DPAPI and owner-only DACL
        if: runner.os == 'Windows' && matrix.adapter == 'claude-code'
        shell: pwsh
        run: |
          $python = '${{ steps.native-environment.outputs.python }}'
          & $python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest installation failed' }
          & $python -m pytest -q tests/test_durable_mailbox_registration.py `
            -k windows_managed_binding_is_dpapi_protected_and_acl_verified
          if ($LASTEXITCODE -ne 0) { throw 'Windows managed-binding proof failed' }
      - name: Prove native Claude wakeup exchange and abrupt-exit recovery
        id: native-wakeup
        if: matrix.adapter == 'claude-code' && (runner.os == 'Windows' || runner.os == 'macOS')
        shell: pwsh
        run: |
          $bootstrap = if ($IsWindows) {
            Join-Path $env:pythonLocation 'python.exe'
          } else {
            Join-Path $env:pythonLocation 'bin/python'
          }
          $wheel = (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/native-dist" -Filter '*.whl' | Select-Object -First 1).FullName
          if (-not $wheel) { throw 'native candidate wheel is absent' }
          $git = (Resolve-Path -LiteralPath (Get-Command git -CommandType Application | Select-Object -First 1).Source).Path
          $invocation = Join-Path $env:RUNNER_TEMP ("brains-native-wakeup-" + [guid]::NewGuid())
          if (Test-Path -LiteralPath $invocation) { throw 'native evidence path already exists' }
          "NATIVE_WAKEUP_INVOCATION=$invocation" >> $env:GITHUB_ENV
          & $bootstrap scripts/probe_native_wakeup_recovery.py `
            --candidate "${{ github.sha }}" `
            --git-executable $git `
            --wheel $wheel `
            --package-manifest "$env:RUNNER_TEMP/native-dist/native-wakeup-package-provenance.json" `
            --invocation-path $invocation
          if ($LASTEXITCODE -ne 0) { throw 'native wakeup recovery proof failed' }
      - name: Verify successful native wakeup evidence for publication
        id: native-wakeup-evidence
        if: success() && matrix.adapter == 'claude-code' && (runner.os == 'Windows' || runner.os == 'macOS')
        shell: pwsh
        run: |
          $bootstrap = if ($IsWindows) {
            Join-Path $env:pythonLocation 'python.exe'
          } else {
            Join-Path $env:pythonLocation 'bin/python'
          }
          $git = (Resolve-Path -LiteralPath (Get-Command git -CommandType Application | Select-Object -First 1).Source).Path
          $wheel = (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/native-dist" -Filter '*.whl' | Select-Object -First 1).FullName
          $result = Join-Path $env:NATIVE_WAKEUP_INVOCATION 'native-wakeup-recovery.json'
          & $bootstrap scripts/probe_native_wakeup_recovery.py `
            --verify-result `
            --candidate "${{ github.sha }}" `
            --git-executable $git `
            --wheel $wheel `
            --package-manifest "$env:RUNNER_TEMP/native-dist/native-wakeup-package-provenance.json" `
            --result $result
          if ($LASTEXITCODE -ne 0) { throw 'native wakeup evidence attestation failed' }
          $evidence = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          "evidence_path=$result" >> $env:GITHUB_OUTPUT
          "evidence_digest=$($evidence.provenance_digest)" >> $env:GITHUB_OUTPUT
      - name: Upload sanitized native wakeup evidence
        if: success() && matrix.adapter == 'claude-code' && (runner.os == 'Windows' || runner.os == 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: native-wakeup-${{ matrix.host.manager }}-py${{ matrix.python }}-${{ github.sha }}
          path: ${{ steps.native-wakeup-evidence.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
      - name: Prove Windows managed-binding DPAPI and owner-only DACL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_durable_mailbox_registration.py \
            -k windows_managed_binding_is_dpapi_protected_and_acl_verified

  claude-wakeup-probe:
    name: pinned Claude wakeup probe
    needs: [docs, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove generated Claude hook discovery and continuation
        shell: pwsh
        run: ./scripts/run_docker_claude_wakeup_probe.ps1

  privacy:
    name: privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal identifiers
        # The patterns live in a repository secret rather than in this file.
        # Spelling them here would publish the very list they exist to catch:
        # a reader learns exactly which identifiers are worth searching for,
        # which is more useful to a stranger than to us.
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: |
          if [ -z "${PRIVACY_PATTERNS}" ]; then
            echo "::notice::PRIVACY_PATTERNS is not set; skipping"
            exit 0
          fi
          if git grep -nI -i -E "${PRIVACY_PATTERNS}" -- .; then
            echo "::error::personal identifier found (see matches above)"; exit 1
          fi
          echo "ok: no personal identifiers"
      - name: Product UI uses Pod terminology
        # Squad remains a documented storage/control alias, but product-facing
        # UI must use the Brains product term Pod.
        run: |
          if git grep -nI -i -E 'feature crew|\bsquad\b|\btribe\b' -- frontend/src; then
            echo "::error::non-product team vocabulary found in the modern UI"; exit 1
          fi
          echo "ok: modern UI uses Pod terminology"

  docker-smoke:
    name: docker image smoke
    needs: [docs, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t brains-ai:ci .
      - name: Run container + health check
        # Builds AND RUNS the image. `docker build` never evaluates
        # CMD/ENTRYPOINT, so an entrypoint that names a non-existent binary
        # (e.g. the dropped `brains` vs `brains-ai`) only fails at container
        # start. This job catches that class of regression by starting the
        # image and waiting for the container's own HEALTHCHECK (which probes
        # the gateway plus MCP listener) to report healthy. We use the
        # internal healthcheck rather than an external curl because serve-all
        # binds to loopback inside the container by default.
        run: |
          set -e
          docker run -d --name brains-smoke brains-ai:ci
          status=starting
          for i in $(seq 1 40); do
            running=$(docker inspect -f '{{.State.Running}}' brains-smoke 2>/dev/null || echo false)
            status=$(docker inspect -f '{{.State.Health.Status}}' brains-smoke 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && break
            if [ "$running" != "true" ]; then status="exited:$(docker inspect -f '{{.State.ExitCode}}' brains-smoke 2>/dev/null)"; break; fi
            sleep 2
          done
          echo "--- container logs ---"
          docker logs brains-smoke || true
          if [ "$status" != "healthy" ]; then
            echo "::error::image did not become healthy (entrypoint/serve-all broken); status=$status"
            exit 1
          fi
          echo "ok: image starts and default serve-all children are healthy"
      - name: Capture container logs
        if: failure()
        run: docker logs brains-smoke > docker-smoke.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-smoke-logs
          path: docker-smoke.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Teardown
        if: always()
        run: docker rm -f brains-smoke || true

  opencode-lifecycle-probe:
    name: pinned OpenCode lifecycle probe
    needs: [docs, lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove plugin autoload and proof-bound restart lifecycle
        shell: pwsh
        run: ./scripts/run_docker_opencode_lifecycle_probe.ps1

  brains-e2e:
    name: Brains E2E (Playwright)
    needs: [docs, lint, typecheck, spa]
    runs-on: ubuntu-latest
    env:
      BRAINS_API_KEY: ci-e2e-key
      BRAINS_E2E_BASE_URL: http://127.0.0.1:8810
      BRAINS_E2E_KEY: ci-e2e-key
      BRAINS_PREWARM_INDEX_ON_SESSION: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project
        run: uv sync --extra dev

      - name: Boot ephemeral hub + seed
        run: |
          set -euo pipefail
          export BRAINS_STATE_DIR="$RUNNER_TEMP/brains-e2e-state"
          export BRAINS_DB_URL="sqlite:///$BRAINS_STATE_DIR/brains.db"
          mkdir -p "$BRAINS_STATE_DIR"
          uv run uvicorn brains.main:app --host 127.0.0.1 --port 8810 >hub.log 2>&1 &
          hub_pid=$!
          echo "$hub_pid" > hub.pid
          ready=false
          for i in $(seq 1 40); do
            if ! kill -0 "$hub_pid" 2>/dev/null; then
              echo "::error::hub exited before becoming healthy"
              cat hub.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8810/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::hub did not become healthy"
            cat hub.log
            exit 1
          fi
          curl -fsS -X POST http://127.0.0.1:8810/v1/orgs \
            -H "x-api-key: $BRAINS_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"slug":"demo","name":"Demo Org"}' >/dev/null

          uv run python - <<'PY'
          import os
          from brains.control.orgs import get_org
          from brains.control.sessions import register_workspace

          state_dir = os.environ["BRAINS_STATE_DIR"]
          org = get_org("demo")
          register_workspace(
              f"{state_dir}/workspace",
              slug="e2e-workspace",
              name="E2E Workspace",
              org_id=int(org["id"]),
          )
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install e2e deps + browser
        working-directory: tests/e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      # Blocking: every J1-J11 browser journey contract must pass on the exact
      # candidate. Remaining browser evidence gaps stay explicit in
      # docs/product/TRACEABILITY.md rather than being hidden by the harness.
      - name: Run Brains E2E
        working-directory: tests/e2e
        run: npx playwright test

      - name: Stop hub
        if: always()
        run: kill "$(cat hub.pid)" 2>/dev/null || true

      - name: Upload hub log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brains-e2e-hub-log
          path: hub.log
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brains-e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  gate:
    name: quality gate
    # One status to require on the branch: it is green only when every gate
    # above succeeded, and a skipped or cancelled dependency fails it.
    needs:
      - docs
      - lint
      - typecheck
      - test
      - migrations
      - spa
      - package
      - native-installation-probe
      - claude-wakeup-probe
      - privacy
      - docker-smoke
      - opencode-lifecycle-probe
      - brains-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -q '"result": *"\(failure\|cancelled\|skipped\)"'; then
            echo "::error::at least one required quality gate did not pass"
            exit 1
          fi
          echo "ok: every required quality gate passed"
