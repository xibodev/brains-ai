name: sync release site

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch published release facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/release-pages.json"
          jq 'add' "$RUNNER_TEMP/release-pages.json" > "$RUNNER_TEMP/releases.json"
          tag="$(PYTHONPATH=scripts python -c 'import json, os; from sync_release_site import stable_releases; print(stable_releases(json.load(open(os.environ["RUNNER_TEMP"] + "/releases.json")), os.environ["GITHUB_REPOSITORY"])[0]["tag_name"])')"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/contents/pyproject.toml?ref=${tag}" --jq .content | base64 --decode > "$RUNNER_TEMP/tagged-pyproject.toml"
          gh api "repos/${GITHUB_REPOSITORY}/contents/src/brains/capabilities.py?ref=${tag}" --jq .content | base64 --decode > "$RUNNER_TEMP/tagged-capabilities.py"
      - name: Generate static release history
        run: |
          python scripts/sync_release_site.py \
            --site site \
            --releases "$RUNNER_TEMP/releases.json" \
            --project "$RUNNER_TEMP/tagged-pyproject.toml" \
            --capabilities "$RUNNER_TEMP/tagged-capabilities.py" \
            --repository "$GITHUB_REPOSITORY"
      - name: Publish only generated site facts
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- site/index.html site/quickstart.html site/mcp.html site/releases.html)"
          [[ -n "$tracked" ]]
          mapfile -t pages <<< "$tracked"
          if ! git diff --quiet -- "${pages[@]}"; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --only -m 'docs: sync published release site' -- "${pages[@]}"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      # Token-authored commits do not trigger site-deploy.yml. Upload even when
      # unchanged so a manual sync can repair a failed deployment.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
